# ==============================================================================
# Subsystem: ADAS Driver Monitoring System (DMS) — Root Docker Compose Bridge
# Target Platform: Raspberry Pi 4B (ARM64 / Cortex-A72) & Desktop
# Upstream Reference: https://github.com/Thorn-probably/adas
# Architecture: Powered by cl0ud (https://github.com/Ojas-sta/cl0ud-brand-engineering)
# Co-Engineered by: Ojas Singh <ojasctc@gmail.com>
# ==============================================================================

version: "3.8"

services:
  adas-headless:
    build:
      context: ./adas
      dockerfile: Dockerfile
    image: adas-rpi:latest
    container_name: adas_dms_headless
    restart: unless-stopped
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/snd:/dev/snd"
    group_add:
      - "video"
      - "audio"
      - "gpio"
    environment:
      - QT_QPA_PLATFORM=offscreen
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py", "--headless", "--gpio-buzzer", "--width", "320", "--height", "240"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M

  adas-gui:
    build:
      context: ./adas
      dockerfile: Dockerfile
    image: adas-rpi:latest
    container_name: adas_dms_gui
    restart: "no"
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - QT_QPA_PLATFORM=xcb
      - PYTHONUNBUFFERED=1
    volumes:
      - "/tmp/.X11-unix:/tmp/.X11-unix:ro"
    ipc: host
    devices:
      - "/dev/video0:/dev/video0"
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/snd:/dev/snd"
    group_add:
      - "video"
      - "audio"
      - "gpio"
    command: ["python", "main.py", "--gpio-buzzer", "--width", "320", "--height", "240"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  adas-picam:
    build:
      context: ./adas
      dockerfile: Dockerfile
    image: adas-rpi:latest
    container_name: adas_dms_picam
    restart: unless-stopped
    devices:
      - "/dev/vchiq:/dev/vchiq"
      - "/dev/dma_heap:/dev/dma_heap"
      - "/dev/video0:/dev/video0"
      - "/dev/gpiomem:/dev/gpiomem"
      - "/dev/snd:/dev/snd"
    group_add:
      - "video"
      - "audio"
      - "gpio"
    environment:
      - QT_QPA_PLATFORM=offscreen
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py", "--headless", "--gpio-buzzer", "--width", "320", "--height", "240"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  adas-simulation:
    build:
      context: ./adas
      dockerfile: Dockerfile
    image: adas-rpi:latest
    container_name: adas_dms_simulation
    restart: "no"
    environment:
      - QT_QPA_PLATFORM=offscreen
      - PYTHONUNBUFFERED=1
    command: ["python", "main.py", "--video", "/app/test_videos/test_eyes_closed.mp4", "--headless"]
